[project]
name = "marxism-skill-tools"
version = "0.1.0"
description = "Standalone navigation maintenance for the marxism-skill Skill"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tools"]